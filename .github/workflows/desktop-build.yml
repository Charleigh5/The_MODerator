name: MODerator Desktop Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "index.html"
      - ".github/workflows/desktop-build.yml"
  push:
    branches:
      - "feature/moderator-desktop-siwc-v0.1"

jobs:
  windows-release:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Evidence gauntlet
        run: npm run gauntlet

      - name: Security gate
        shell: pwsh
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=high

      - name: Package Windows
        run: npm run desktop:pack

      - name: Packaged smoke
        shell: pwsh
        run: |
          Remove-Item "$env:APPDATA\moderator-desktop\desktop-smoke.json" -Force -ErrorAction SilentlyContinue
          $env:MODERATOR_SMOKE_TEST = "1"
          $proc = Start-Process -FilePath ".\release\win-unpacked\MODerator Desktop.exe" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Packaged smoke exited $($proc.ExitCode)" }
          $smoke = Get-Content "$env:APPDATA\moderator-desktop\desktop-smoke.json" -Raw | ConvertFrom-Json
          if (-not $smoke.packaged -or -not $smoke.result.bridge -or -not $smoke.result.studio -or
              -not $smoke.result.libraryOpen -or $smoke.result.libraryCards -lt 37 -or
              -not $smoke.result.communityPanel -or $smoke.result.assessmentRows -lt 37 -or
              -not $smoke.result.reviewAdapterReady -or -not $smoke.result.planEnabled) {
            throw "Packaged smoke receipt did not prove Madden studio, desktop bridge, catalog, quality audit and review adapter"
          }
          Copy-Item "$env:APPDATA\moderator-desktop\desktop-smoke.json" ".\release\desktop-smoke.json"

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash .\release\MODerator-Desktop-Setup-0.1.0.exe -Algorithm SHA256 |
            Select-Object Path, Hash | ConvertTo-Json | Set-Content .\release\setup-sha256.json
          Get-FileHash .\release\MODerator-Desktop-Portable-0.1.0.exe -Algorithm SHA256 |
            Select-Object Path, Hash | ConvertTo-Json | Set-Content .\release\portable-sha256.json

      - uses: actions/upload-artifact@v4
        with:
          name: moderator-desktop-windows-v0.1.0
          if-no-files-found: error
          retention-days: 14
          path: |
            release/MODerator-Desktop-Setup-0.1.0.exe
            release/MODerator-Desktop-Portable-0.1.0.exe
            release/desktop-smoke.json
            release/setup-sha256.json
            release/portable-sha256.json
