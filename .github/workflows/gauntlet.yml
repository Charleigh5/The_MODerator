name: MODerator Evidence Gauntlet
on:
  push:
    branches: ["feature/full-implementation-gauntlet-20260915"]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run gauntlet
